baseURL = "https://bytecolony.computer/"
languageCode = "en-us"
title = "Byte Colony"
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[markup.goldmark.extensions.extras.alert]
  enable = true

[markup.highlight]
  codeFences = true
  noClasses = false
  lineNos = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

# Custom "Raw" output — bare HTML rendering of a page with no site chrome.
# Enabled on writing pages via cascade in content/writing/_index.md.
[outputFormats.Raw]
  mediaType = "text/html"
  baseName = "raw"
  isPlainText = false
  notAlternative = false

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

[params]
  tagline = "a journey underground"
  pitch   = "My adventure underground as I feed my interest in computers!"
  github  = "https://github.com/ekansh38"
  youtube = "https://www.youtube.com/@byte_colony"
  itchio  = "https://byte-colony.itch.io/"
  email   = "ekansh@ekanshgoenka.com"
  dob     = "2013-04-04"
