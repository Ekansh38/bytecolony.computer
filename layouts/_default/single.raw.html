<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}</title>
<meta name="robots" content="noindex">

<!-- github-markdown-css (Sindre Sorhus): the CSS GitHub uses to render markdown.
     Same stylesheet that markdown-preview.nvim ships with. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css">

<!-- Recommended container snippet from the github-markdown-css README -->
<style>
  body {
    box-sizing: border-box;
    min-width: 200px;
    max-width: 980px;
    margin: 0 auto;
    padding: 45px;
    background-color: #0d1117;
  }
  @media (max-width: 767px) { body { padding: 15px; } }
  .markdown-body img,
  .markdown-body svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<article class="markdown-body">
  <h1>{{ .Title }}</h1>
  <p><em>{{ .Date.Format "2006-01-02" }}</em></p>
  <hr>
  {{ .Content }}
</article>
<script>
document.querySelectorAll('.callout-body br').forEach(function(br){
  br.replaceWith(document.createTextNode(' '));
});
</script>
</body>
</html>
