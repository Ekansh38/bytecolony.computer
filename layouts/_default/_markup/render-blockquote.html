{{ if eq .Type "alert" }}
{{ $body := .Text | strings.ReplaceAll "<br>\n" " " }}
<div class="callout callout-{{ .AlertType }}">
  <div class="callout-label">{{ strings.ToUpper .AlertType }}</div>
  <div class="callout-body">{{ $body | safeHTML }}</div>
</div>
{{ else }}
<blockquote>{{ .Text | safeHTML }}</blockquote>
{{ end }}
