{{ define "main" }}
<div id="admin-app">
  <!-- Auth gate -->
  <div id="admin-auth">
    <div class="adm-auth-box">
      <h2>admin</h2>
      <p class="adm-auth-hint">enter master code</p>
      <div class="adm-auth-row">
        <input type="password" id="adm-code" placeholder="master code" autocomplete="off">
        <button id="adm-login" class="adm-btn adm-btn-primary">enter</button>
      </div>
      <p id="adm-auth-err"></p>
    </div>
  </div>

  <!-- Admin panel (hidden until auth) -->
  <div id="admin-panel" style="display:none;">
    <div class="adm-top">
      <h2>admin</h2>
    </div>

    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="presets">presets</button>
      <button class="adm-tab" data-tab="analytics">analytics</button>
      <button class="adm-tab" data-tab="guestbook">guestbook</button>
      <button class="adm-tab" data-tab="comments">comments</button>
      <button class="adm-tab" data-tab="arcade">arcade</button>
    </div>

    <div class="adm-tab-content" id="tab-presets">
      <div class="adm-section-header">
        <span class="adm-section-status" id="preset-status"></span>
        <div class="adm-section-actions">
          <button id="preset-new" class="adm-btn adm-btn-sm">+ new preset</button>
          <button id="preset-save" class="adm-btn adm-btn-sm adm-btn-primary">save all</button>
        </div>
      </div>
      <div id="preset-list"></div>
    </div>

    <div class="adm-tab-content" id="tab-analytics" style="display:none;">
      <div class="adm-section-header">
        <span class="adm-section-status" id="an-status"></span>
        <div class="adm-section-actions">
          <button id="an-refresh" class="adm-btn adm-btn-sm">refresh</button>
        </div>
      </div>
      <div id="an-app"></div>
    </div>

    <div class="adm-tab-content" id="tab-guestbook" style="display:none;">
      <div class="adm-section-header">
        <span class="adm-section-status" id="gb-status"></span>
      </div>
      <div id="gb-list"></div>
    </div>

    <div class="adm-tab-content" id="tab-comments" style="display:none;">
      <div class="adm-section-header">
        <span class="adm-section-status" id="cmt-status"></span>
      </div>
      <div id="cmt-list-admin"></div>
    </div>

    <div class="adm-tab-content" id="tab-arcade" style="display:none;">
      <div class="adm-section-header">
        <span class="adm-section-status" id="arc-status"></span>
      </div>
      <div id="arc-list"></div>
    </div>
  </div>
</div>

<style>
  header, footer { display: none !important; }
  body { max-width: 1100px !important; }
  #admin-app { padding: 20px 0; }

  /* Auth */
  #admin-auth { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
  .adm-auth-box { text-align: center; }
  .adm-auth-box h2 { margin-bottom: 12px; color: var(--fg); }
  .adm-auth-hint { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; }
  .adm-auth-row { display: flex; gap: 8px; justify-content: center; }
  .adm-auth-row input {
    background: var(--code-bg); border: 1px solid var(--border); color: var(--fg);
    font-family: inherit; font-size: inherit; padding: 8px 14px; outline: none; width: 240px;
  }
  .adm-auth-row input:focus { border-color: var(--accent); }
  #adm-auth-err { color: var(--code-err); margin-top: 10px; font-size: 0.85rem; min-height: 1.2em; }

  /* Buttons */
  .adm-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: inherit; font-size: 0.85rem; padding: 6px 14px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .adm-btn:hover { color: var(--accent); border-color: var(--accent); }
  .adm-btn-primary { color: var(--accent); border-color: var(--accent); }
  .adm-btn-primary:hover { background: var(--accent); color: var(--bg); }
  .adm-btn-danger:hover { background: var(--code-err); color: var(--bg); border-color: var(--code-err); }
  .adm-btn-sm { font-size: 0.78rem; padding: 4px 10px; }

  /* Top bar */
  .adm-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .adm-top h2 { margin: 0; color: var(--fg); }

  /* Tabs */
  .adm-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .adm-tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: inherit; font-size: 0.9rem;
    padding: 10px 20px; cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .adm-tab:hover { color: var(--fg); }
  .adm-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Section header */
  .adm-section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .adm-section-status { font-size: 0.82rem; color: var(--muted); }
  .adm-section-actions { display: flex; gap: 6px; }

  /* Cards (shared) */
  .adm-card {
    border: 1px solid var(--border); padding: 14px 16px; margin-bottom: -1px;
    transition: border-color 0.15s;
  }
  .adm-card:first-child { border-radius: 4px 4px 0 0; }
  .adm-card:last-child { border-radius: 0 0 4px 4px; margin-bottom: 0; }
  .adm-card:only-child { border-radius: 4px; }

  .adm-card-bar {
    display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
  }
  .adm-card-arrow {
    color: var(--muted); font-size: 0.7rem; transition: transform 0.2s;
    width: 14px; text-align: center; flex-shrink: 0;
  }
  .adm-card.expanded .adm-card-arrow { transform: rotate(90deg); }
  .adm-card-title { font-weight: 700; font-size: 0.92rem; flex: 1; }
  .adm-card-meta { color: var(--muted); font-size: 0.78rem; }
  .adm-card-actions { display: flex; gap: 6px; }
  .adm-card-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .adm-card.expanded .adm-card-body { display: block; }

  /* Preset-specific */
  .adm-preset-swatch {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
  }
  .adm-param-grid {
    display: grid; grid-template-columns: 1fr; gap: 4px;
  }
  .adm-param {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    background: var(--code-bg); border-radius: 3px; font-size: 0.8rem;
    overflow: hidden;
  }
  .adm-param label { color: var(--muted); min-width: 80px; white-space: nowrap; flex-shrink: 0; font-size: 0.75rem; }
  .adm-param input[type="range"] {
    flex: 1; min-width: 80px; accent-color: var(--accent); height: 4px; cursor: pointer;
    -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 2px; outline: none;
  }
  .adm-param input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  .adm-param .adm-param-val {
    color: var(--fg); font-size: 0.72rem; width: 38px; text-align: right;
    font-variant-numeric: tabular-nums;
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 2px 3px; font-family: inherit; outline: none; flex-shrink: 0;
    -moz-appearance: textfield;
  }
  .adm-param .adm-param-val::-webkit-inner-spin-button,
  .adm-param .adm-param-val::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .adm-param .adm-param-val:focus { border-color: var(--accent); }
  .adm-param input[type="text"], .adm-param select {
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    font-family: inherit; font-size: 0.8rem; padding: 3px 8px; outline: none;
  }
  .adm-param input[type="text"] { width: 120px; }
  .adm-param select { width: 140px; }
  .adm-param input:focus, .adm-param select:focus { border-color: var(--accent); }
  .adm-param-none { opacity: 0.35; }
  .adm-param-none input[type="range"] { pointer-events: none; }
  .adm-param-none .adm-param-val { color: var(--muted); }
  .adm-none-toggle {
    font-size: 0.6rem !important; padding: 1px 5px !important;
    border-radius: 3px; flex-shrink: 0; line-height: 1.3;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .adm-none-toggle.active { background: var(--muted); color: var(--bg); border-color: var(--muted); }
  .adm-preset-actions { display: flex; gap: 6px; margin-top: 12px; }

  /* Guestbook entry */
  .adm-gb-msg { font-size: 0.88rem; line-height: 1.6; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .adm-gb-context { color: var(--muted); font-size: 0.78rem; }

  /* Arcade entry */
  .adm-arc-desc { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .adm-arc-author { color: var(--muted); font-size: 0.78rem; }

  /* ── Analytics ──────────────────────────────────────────────── */
  .an-tiles {
    display: grid; gap: 10px; margin-bottom: 22px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  @media (max-width: 720px) { .an-tiles { grid-template-columns: repeat(2, 1fr); } }
  .an-tile {
    border: 1px solid var(--border); padding: 14px 16px; border-radius: 6px;
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 4%, transparent));
  }
  .an-tile-label {
    color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 700;
  }
  .an-tile-num {
    font-size: 1.9rem; font-weight: 700; color: var(--fg);
    font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px;
    letter-spacing: -0.02em;
  }
  .an-tile-sub {
    color: var(--muted); font-size: 0.75rem; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .an-tile-accent .an-tile-num { color: var(--accent); }

  .an-card {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 16px 18px; margin-bottom: 18px;
  }
  .an-card-hd {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
  }
  .an-card-title {
    font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .an-card-hint {
    font-size: 0.72rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .an-chart { width: 100%; display: block; height: 180px; }
  .an-chart-tick { fill: var(--muted); font-family: inherit; font-size: 9px; opacity: 0.7; }
  .an-chart-grid { stroke: var(--border); stroke-width: 1; opacity: 0.6; }
  .an-chart-bar { fill: var(--accent); opacity: 0.85; transition: opacity 0.12s; }
  .an-chart-bar.reads { fill: color-mix(in srgb, var(--accent) 60%, var(--fg)); opacity: 0.95; }
  .an-chart-bar:hover { opacity: 1; }
  .an-chart-hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
  .an-chart-empty { fill: var(--muted); font-size: 11px; opacity: 0.5; font-family: inherit; }

  .an-legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--muted); }
  .an-legend-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    vertical-align: middle; margin-right: 4px;
  }
  .an-legend-views { background: var(--accent); opacity: 0.85; }
  .an-legend-reads { background: color-mix(in srgb, var(--accent) 60%, var(--fg)); }

  .an-articles { display: flex; flex-direction: column; }
  .an-row {
    display: grid; grid-template-columns: 1fr 92px 92px 90px 72px;
    gap: 8px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border); border-bottom: none;
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
    font-size: 0.86rem;
  }
  .an-row:first-child { border-radius: 6px 6px 0 0; }
  .an-row:last-child  { border-bottom: 1px solid var(--border); border-radius: 0 0 6px 6px; }
  .an-row:only-child  { border-radius: 6px; border-bottom: 1px solid var(--border); }
  .an-row:hover {
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    border-color: var(--accent);
  }
  .an-row-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--fg); font-weight: 600;
  }
  .an-row-path .an-row-sub {
    color: var(--muted); font-weight: 400; font-size: 0.76rem; margin-left: 6px;
  }
  .an-row-num {
    text-align: right; font-variant-numeric: tabular-nums; color: var(--fg);
    font-size: 0.85rem;
  }
  .an-row-num.dim { color: var(--muted); }
  .an-row-spark { width: 90px; height: 22px; display: block; }
  .an-row-spark path { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0.9; }
  .an-row-spark rect { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
  @media (max-width: 720px) {
    .an-row { grid-template-columns: 1fr 70px 60px; font-size: 0.8rem; }
    .an-row-spark, .an-row .an-row-num.reads { display: none; }
  }

  .an-articles-hd {
    display: grid; grid-template-columns: 1fr 92px 92px 90px 72px;
    gap: 8px; padding: 0 12px 6px;
    color: var(--muted); font-size: 0.7rem;
    letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700;
  }
  .an-articles-hd > *:nth-child(n+2) { text-align: right; }
  @media (max-width: 720px) {
    .an-articles-hd { grid-template-columns: 1fr 70px 60px; }
    .an-articles-hd .hide-sm { display: none; }
  }

  .an-back {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-family: inherit; font-size: 0.85rem; padding: 0; margin-bottom: 12px;
    transition: color 0.12s;
  }
  .an-back:hover { color: var(--accent); }

  .an-drill-title {
    font-size: 1.15rem; font-weight: 700; color: var(--fg); margin: 2px 0 4px;
    word-break: break-all;
  }
  .an-drill-sub { color: var(--muted); font-size: 0.78rem; margin-bottom: 18px; }

  .an-two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .an-two-col { grid-template-columns: 1fr; } }

  .an-depth-list { display: flex; flex-direction: column; gap: 6px; }
  .an-depth-row {
    display: grid; grid-template-columns: 44px 1fr 48px;
    gap: 10px; align-items: center; font-size: 0.82rem;
  }
  .an-depth-label {
    color: var(--muted); font-variant-numeric: tabular-nums; text-align: right;
    font-size: 0.76rem;
  }
  .an-depth-bar {
    height: 14px; background: var(--code-bg); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .an-depth-fill {
    position: absolute; inset: 0 auto 0 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent), var(--accent));
    border-radius: 3px;
    transition: width 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .an-depth-count {
    text-align: right; font-variant-numeric: tabular-nums;
    color: var(--fg); font-size: 0.78rem;
  }

  .an-ref-list { display: flex; flex-direction: column; gap: 4px; }
  .an-ref-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: var(--code-bg); border-radius: 3px;
    font-size: 0.8rem;
  }
  .an-ref-origin {
    color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-right: 10px;
  }
  .an-ref-count { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }
  .an-empty { color: var(--muted); font-size: 0.85rem; padding: 20px 0; text-align: center; }

  .an-danger-zone {
    margin-top: 22px; padding-top: 14px;
    border-top: 1px dashed var(--border);
    display: flex; justify-content: flex-end;
  }
</style>

<script>
(function () {
  var API = '/api/themes';
  var masterCode = '';
  var presets = {};

  // ── Auth ──
  var codeInput = document.getElementById('adm-code');
  var loginBtn = document.getElementById('adm-login');
  var authErr = document.getElementById('adm-auth-err');

  function headers() {
    return { 'Content-Type': 'application/json', 'X-Master-Code': masterCode };
  }

  function doLogin() {
    masterCode = codeInput.value.trim();
    if (!masterCode) { authErr.textContent = 'enter code'; return; }
    authErr.textContent = 'checking...';
    fetch(API + '?action=verify', { headers: { 'X-Master-Code': masterCode } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { authErr.textContent = 'wrong code'; return; }
        showPanel();
      })
      .catch(function () { authErr.textContent = 'network error'; });
  }

  loginBtn.addEventListener('click', doLogin);
  codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

  function showPanel() {
    document.getElementById('admin-auth').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadPresets();
  }

  // ── Tabs ──
  document.querySelectorAll('.adm-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.adm-tab').forEach(function (t) { t.classList.remove('active'); });
      document.querySelectorAll('.adm-tab-content').forEach(function (c) { c.style.display = 'none'; });
      tab.classList.add('active');
      var target = document.getElementById('tab-' + tab.getAttribute('data-tab'));
      if (target) target.style.display = 'block';
      // lazy load
      if (tab.getAttribute('data-tab') === 'guestbook') loadGuestbook();
      if (tab.getAttribute('data-tab') === 'comments') loadComments();
      if (tab.getAttribute('data-tab') === 'arcade') loadArcade();
      if (tab.getAttribute('data-tab') === 'analytics') loadAnalytics();
    });
  });

  // ══════════════════════════════════════════════════════════════
  // PRESETS
  // ══════════════════════════════════════════════════════════════
  var THEMES = ['tokyo-night','gruvbox','dracula','rose-pine','github-light','papercolor-light','hacker'];
  var SIMS = ['combo','life','boids'];

  function seedFromCode() {
    if (typeof window.getPresetNames !== 'function') return;
    var names = window.getPresetNames();
    names.forEach(function (n) {
      var p = window._getPresetData ? window._getPresetData(n) : null;
      if (p) presets[n] = JSON.parse(JSON.stringify(p));
    });
  }

  function loadPresets() {
    document.getElementById('preset-status').textContent = 'loading...';
    fetch(API + '?action=presets')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        presets = d.presets || {};
        if (!Object.keys(presets).length) {
          seedFromCode();
          document.getElementById('preset-status').textContent = Object.keys(presets).length + ' presets (from code — save to persist)';
        } else {
          document.getElementById('preset-status').textContent = Object.keys(presets).length + ' presets';
        }
        renderPresets();
      })
      .catch(function (err) { document.getElementById('preset-status').textContent = 'error: ' + err.message; });
  }

  var themeColors = {'tokyo-night':'#7aa2f7','gruvbox':'#d79921','dracula':'#bd93f9','rose-pine':'#b4637a','github-light':'#0969da','papercolor-light':'#005f87','hacker':'#00ff41'};
  var originalPresets = {};

  // slider definitions: key, label, min, max, step
  var PARAM_SLIDERS = [
    {key:'life.cell',label:'cell size',min:1,max:80,step:1},
    {key:'life.opacity',label:'life opacity',min:0,max:100,step:1},
    {key:'life.glow',label:'life glow',min:0,max:100,step:1},
    {key:'life.autofill',label:'autofill',min:0,max:100,step:1},
    {key:'life.rainbow',label:'rainbow',min:0,max:3,step:1},
    {key:'boids.n',label:'boid count',min:1,max:1000,step:1},
    {key:'boids.size',label:'boid size',min:1,max:200,step:1},
    {key:'boids.tick',label:'boid speed',min:0.1,max:5,step:0.1},
    {key:'boids.opacity',label:'boid opacity',min:0,max:100,step:1},
    {key:'boids.glow',label:'boid glow',min:0,max:100,step:1},
    {key:'boids.perception',label:'perception',min:1,max:500,step:1},
    {key:'boids.separation',label:'separation',min:0,max:300,step:1},
    {key:'trail.on',label:'trail',min:0,max:1,step:1},
    {key:'trail.size',label:'trail size',min:1,max:10,step:1},
    {key:'trail.glow',label:'trail glow',min:0,max:100,step:1},
    {key:'trail.decay',label:'trail decay',min:0,max:100,step:1},
  ];
  var SPEED_SLIDERS = [
    {key:'lspeed',label:'life speed',min:0,max:100,step:1},
    {key:'bspeed',label:'boid speed',min:0,max:100,step:1},
  ];

  function liveApply(name, p) {
    if (!window.applyPreset) return;
    // inject preset data into the live sim
    if (window._setPresetData) window._setPresetData(name, p);
    window.applyPreset(name);
  }

  function renderPresets() {
    var list = document.getElementById('preset-list');
    list.innerHTML = '';
    // save originals for reset
    if (!Object.keys(originalPresets).length) originalPresets = JSON.parse(JSON.stringify(presets));

    Object.keys(presets).forEach(function (name) {
      var p = presets[name];
      var card = document.createElement('div');
      card.className = 'adm-card';

      var bar = document.createElement('div');
      bar.className = 'adm-card-bar';
      var arrow = document.createElement('span');
      arrow.className = 'adm-card-arrow';
      arrow.textContent = '\u25B6';
      var swatch = document.createElement('span');
      swatch.className = 'adm-preset-swatch';
      swatch.style.background = themeColors[p.theme] || 'var(--accent)';

  function mkSlider(label, value, min, max, step, onChange) {
    var el = document.createElement('div');
    el.className = 'adm-param';
    var lbl = document.createElement('label');
    lbl.textContent = label;
    var numInp = document.createElement('input');
    numInp.type = 'number';
    numInp.className = 'adm-param-val';
    numInp.min = min; numInp.max = max; numInp.step = step;
    numInp.value = value != null ? value : min;
    var inp = document.createElement('input');
    inp.type = 'range';
    inp.min = min; inp.max = max; inp.step = step;
    inp.value = value != null ? value : min;
    inp.addEventListener('input', function () {
      var v = step < 1 ? parseFloat(inp.value) : parseInt(inp.value, 10);
      numInp.value = v;
      onChange(v);
    });
    numInp.addEventListener('change', function () {
      var v = step < 1 ? parseFloat(numInp.value) : parseInt(numInp.value, 10);
      if (isNaN(v)) v = min;
      if (v < min) v = min;
      if (v > max) v = max;
      numInp.value = v;
      inp.value = v;
      onChange(v);
    });
    el.appendChild(lbl);
    el.appendChild(inp);
    el.appendChild(numInp);
    return el;
  }

  function mkText(label, value, onChange) {
    var el = document.createElement('div');
    el.className = 'adm-param';
    var lbl = document.createElement('label');
    lbl.textContent = label;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = value;
    inp.addEventListener('change', function () { onChange(inp.value); });
    el.appendChild(lbl);
    el.appendChild(inp);
    return el;
  }

  function mkSelect(label, value, options, onChange) {
    var el = document.createElement('div');
    el.className = 'adm-param';
    var lbl = document.createElement('label');
    lbl.textContent = label;
    var sel = document.createElement('select');
    options.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o; opt.textContent = o || '(none)';
      if (o === value) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function () { onChange(sel.value); });
    el.appendChild(lbl);
    el.appendChild(sel);
    return el;
  }

  function mkSpeedSlider(s, p, presetName) {
    var isNone = p[s.key] == null;
    var el = document.createElement('div');
    el.className = 'adm-param' + (isNone ? ' adm-param-none' : '');
    var lbl = document.createElement('label');
    lbl.textContent = s.label;
    var noneBtn = document.createElement('button');
    noneBtn.className = 'adm-btn adm-btn-sm adm-none-toggle' + (isNone ? ' active' : '');
    noneBtn.textContent = 'none';
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = s.min; inp.max = s.max; inp.step = s.step;
    inp.value = isNone ? 15 : p[s.key]; inp.disabled = isNone;
    var numInp = document.createElement('input');
    numInp.type = 'number'; numInp.className = 'adm-param-val';
    numInp.min = s.min; numInp.max = s.max; numInp.step = s.step;
    numInp.value = isNone ? '' : p[s.key]; numInp.disabled = isNone;
    if (isNone) numInp.placeholder = '—';
    noneBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      isNone = !isNone;
      noneBtn.classList.toggle('active', isNone);
      el.classList.toggle('adm-param-none', isNone);
      inp.disabled = isNone; numInp.disabled = isNone;
      if (isNone) { p[s.key] = null; numInp.value = ''; numInp.placeholder = '—'; }
      else { p[s.key] = 15; inp.value = 15; numInp.value = 15; numInp.placeholder = ''; liveApply(presetName, p); }
    });
    inp.addEventListener('input', function () {
      if (isNone) return;
      var v = parseInt(inp.value, 10); numInp.value = v; p[s.key] = v; liveApply(presetName, p);
    });
    numInp.addEventListener('change', function () {
      if (isNone) return;
      var v = parseInt(numInp.value, 10);
      if (isNaN(v)) v = s.min; v = Math.max(s.min, Math.min(s.max, v));
      numInp.value = v; inp.value = v; p[s.key] = v; liveApply(presetName, p);
    });
    el.appendChild(lbl); el.appendChild(noneBtn); el.appendChild(inp); el.appendChild(numInp);
    return el;
  }

  var PARAM_DEFAULTS = {
    'life.cell':7,'life.opacity':9,'life.glow':0,'life.autofill':50,'life.rainbow':0,
    'boids.n':120,'boids.size':14,'boids.tick':1.8,'boids.opacity':14,'boids.glow':0,

  function mkParamSlider(s, p, presetName) {
    var isNone = p.params[s.key] == null;
    var el = document.createElement('div');
    el.className = 'adm-param' + (isNone ? ' adm-param-none' : '');

    var lbl = document.createElement('label');
    lbl.textContent = s.label;

    var noneBtn = document.createElement('button');
    noneBtn.className = 'adm-btn adm-btn-sm adm-none-toggle' + (isNone ? ' active' : '');
    noneBtn.textContent = 'none';

    var inp = document.createElement('input');
    inp.type = 'range';
    inp.min = s.min; inp.max = s.max; inp.step = s.step;
    inp.value = isNone ? (PARAM_DEFAULTS[s.key] || s.min) : p.params[s.key];
    inp.disabled = isNone;

    var numInp = document.createElement('input');
    numInp.type = 'number';
    numInp.className = 'adm-param-val';
    numInp.min = s.min; numInp.max = s.max; numInp.step = s.step;
    numInp.value = isNone ? '' : (p.params[s.key] != null ? p.params[s.key] : s.min);
    numInp.disabled = isNone;
    if (isNone) numInp.placeholder = '—';

    noneBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      isNone = !isNone;
      noneBtn.classList.toggle('active', isNone);
      el.classList.toggle('adm-param-none', isNone);
      inp.disabled = isNone;
      numInp.disabled = isNone;
      if (isNone) {
        delete p.params[s.key];
        numInp.value = '';
        numInp.placeholder = '—';
      } else {
        var def = PARAM_DEFAULTS[s.key] || parseFloat(s.min);
        p.params[s.key] = def;
        inp.value = def;
        numInp.value = def;
        numInp.placeholder = '';
        liveApply(presetName, p);
      }
    });

    inp.addEventListener('input', function () {
      if (isNone) return;
      var v = s.step < 1 ? parseFloat(inp.value) : parseInt(inp.value, 10);
      numInp.value = v;
      p.params[s.key] = v;
      liveApply(presetName, p);
    });
    numInp.addEventListener('change', function () {
      if (isNone) return;
      var v = s.step < 1 ? parseFloat(numInp.value) : parseInt(numInp.value, 10);
      if (isNaN(v)) v = parseFloat(s.min);
      if (v < s.min) v = parseFloat(s.min);
      if (v > s.max) v = parseFloat(s.max);
      numInp.value = v;
      inp.value = v;
      p.params[s.key] = v;
      liveApply(presetName, p);
    });

    el.appendChild(lbl);
    el.appendChild(noneBtn);
    el.appendChild(inp);
    el.appendChild(numInp);
    return el;
  }

  function svg(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 10000)   return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function pct(a, b) {
    if (!b) return '0%';
    return Math.round(a / b * 100) + '%';
  }

  function niceLabel(path) {
    // Human-friendly label from a path: last non-empty segment, spaces, no dashes.
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) return 'home';
    return parts[parts.length - 1].replace(/-/g, ' ');
  }

  function anLoad(force) {
    if (anLoaded && !force) return;
    anLoaded = true;
    var app = document.getElementById('an-app');
    document.getElementById('an-status').textContent = 'loading...';
    app.innerHTML = '';
    fetch('/api/beacon?action=overview', { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { document.getElementById('an-status').textContent = d.error; return; }
        anData = d;
        anDrillCache = {};
        renderAnOverview();
      })
      .catch(function (err) { document.getElementById('an-status').textContent = 'error: ' + err.message; });
  }
  function loadAnalytics() { anLoad(false); }
  document.getElementById('an-refresh').addEventListener('click', function () { anLoad(true); });

  function renderAnOverview() {
    var app = document.getElementById('an-app');
    app.innerHTML = '';
    var t = anData.totals;
    document.getElementById('an-status').textContent =
      anData.articles.length + ' paths tracked  ·  ' + fmtNum(t.views_all) + ' all-time views';

    // ── Stat tiles ──
    var tiles = el('div', 'an-tiles');
    tiles.appendChild(mkTile('Views (30d)',   fmtNum(t.views_30d), fmtNum(t.views_all) + ' all-time', true));
    tiles.appendChild(mkTile('Reads (30d)',   fmtNum(t.reads_30d), fmtNum(t.reads_all) + ' all-time', false));
    tiles.appendChild(mkTile('Read rate',     pct(t.reads_30d, t.views_30d), 'reads / views · 30d', false));
    tiles.appendChild(mkTile('Paths',         String(anData.articles.length), 'unique paths seen', false));
    app.appendChild(tiles);

    // ── Big 30-day chart ──
    var chartCard = el('div', 'an-card');
    var hd = el('div', 'an-card-hd');
    hd.appendChild(el('span', 'an-card-title', 'Last 30 days'));
    var legend = el('div', 'an-legend');
    var lv = el('span', null, null);
    lv.innerHTML = '<span class="an-legend-dot an-legend-views"></span>views';
    var lr = el('span', null, null);
    lr.innerHTML = '<span class="an-legend-dot an-legend-reads"></span>reads';
    legend.appendChild(lv); legend.appendChild(lr);
    hd.appendChild(legend);
    chartCard.appendChild(hd);
    chartCard.appendChild(mkBarChart(anData.timeseries));
    app.appendChild(chartCard);

    // ── Articles list ──
    var listCard = el('div', 'an-card');
    var lhd = el('div', 'an-card-hd');
    lhd.appendChild(el('span', 'an-card-title', 'Paths (click for details)'));
    lhd.appendChild(el('span', 'an-card-hint', 'sorted by all-time views'));
    listCard.appendChild(lhd);

    if (!anData.articles.length) {
      listCard.appendChild(el('div', 'an-empty', 'no views recorded yet — visit a page from an incognito browser to seed the store'));
      app.appendChild(listCard);
      return;
    }

    var thead = el('div', 'an-articles-hd');
    thead.appendChild(el('span', null, 'path'));
    thead.appendChild(el('span', 'hide-sm', 'sparkline'));
    thead.appendChild(el('span', null, 'views'));
    thead.appendChild(el('span', 'reads hide-sm', 'reads'));
    thead.appendChild(el('span', null, 'read%'));
    listCard.appendChild(thead);

    var rows = el('div', 'an-articles');
    anData.articles.forEach(function (a) {
      var row = el('div', 'an-row');
      var pathCell = el('span', 'an-row-path');
      pathCell.appendChild(document.createTextNode(niceLabel(a.path)));
      var sub = el('span', 'an-row-sub', a.path);
      pathCell.appendChild(sub);
      row.appendChild(pathCell);
      row.appendChild(mkSparklineFor(a.path));
      row.appendChild(el('span', 'an-row-num', fmtNum(a.views)));
      row.appendChild(el('span', 'an-row-num reads', fmtNum(a.reads)));
      row.appendChild(el('span', 'an-row-num dim', pct(a.reads, a.views)));
      row.addEventListener('click', function () { anDrill(a.path); });
      rows.appendChild(row);
    });
    listCard.appendChild(rows);
    app.appendChild(listCard);
  }

  function mkTile(label, num, sub, accent) {
    var t = el('div', 'an-tile' + (accent ? ' an-tile-accent' : ''));
    t.appendChild(el('div', 'an-tile-label', label));
    t.appendChild(el('div', 'an-tile-num', num));
    if (sub) t.appendChild(el('div', 'an-tile-sub', sub));
    return t;
  }

  // ── Charts ──────────────────────────────────────────────────
  // Big stacked bar chart of last N days: views + reads
  function mkBarChart(series) {
    var W = 720, H = 180;
    var padL = 32, padR = 8, padT = 12, padB = 22;
    var innerW = W - padL - padR;
    var innerH = H - padT - padB;
    var s = svg('svg', { class: 'an-chart', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none' });

    var max = 0;
    series.forEach(function (d) { if (d.views > max) max = d.views; });
    if (max === 0) {
      var msg = svg('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', class: 'an-chart-empty' });
      msg.textContent = 'no data yet';
      s.appendChild(msg);
      return s;
    }

    // Round max up to a "nice" number so gridlines aren't ugly
    var niceMax = niceCeil(max);

    // Horizontal gridlines (4 divisions)
    for (var g = 0; g <= 4; g++) {
      var y = padT + (innerH / 4) * g;
      var line = svg('line', { x1: padL, y1: y, x2: W - padR, y2: y, class: 'an-chart-grid' });
      s.appendChild(line);
      var lbl = svg('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', class: 'an-chart-tick' });
      lbl.textContent = fmtNum(Math.round(niceMax * (4 - g) / 4));
      s.appendChild(lbl);
    }

    var n = series.length;
    var bw = innerW / n;
    var gap = Math.max(1.5, bw * 0.18);

    series.forEach(function (d, i) {
      var x = padL + i * bw + gap / 2;
      var w = bw - gap;
      var vh = Math.round(d.views / niceMax * innerH);
      var rh = Math.round(d.reads / niceMax * innerH);
      // views bar (behind)
      if (vh > 0) {
        var bv = svg('rect', {
          x: x, y: padT + innerH - vh, width: w, height: vh,
          class: 'an-chart-bar', rx: 1.5
        });
        bv.appendChild(mkTitle(d.day + ' — ' + d.views + ' views · ' + d.reads + ' reads'));
        s.appendChild(bv);
      }
      // reads bar (front, thinner, overlaid centered)
      if (rh > 0) {
        var rw = Math.max(2, w * 0.55);
        var rx = x + (w - rw) / 2;
        var br = svg('rect', {
          x: rx, y: padT + innerH - rh, width: rw, height: rh,
          class: 'an-chart-bar reads', rx: 1.5
        });
        br.appendChild(mkTitle(d.day + ' — ' + d.reads + ' reads (' + pct(d.reads, d.views) + ' rate)'));
        s.appendChild(br);
      }
    });

    // X-axis: show every 5th day
    for (var i = 0; i < n; i++) {
      if (i === 0 || i === n - 1 || (i % 5 === 0 && i !== n - 1 && i !== n - 2)) {
        var xx = padL + i * bw + bw / 2;
        var t = svg('text', { x: xx, y: H - 6, 'text-anchor': 'middle', class: 'an-chart-tick' });
        t.textContent = series[i].day.slice(5); // MM-DD
        s.appendChild(t);
      }
    }
    return s;
  }

  function mkTitle(text) {
    var t = document.createElementNS(SVG_NS, 'title');
    t.textContent = text;
    return t;
  }

  function niceCeil(v) {
    if (v <= 1) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var norm = v / mag;
    var nice;
    if (norm <= 1)      nice = 1;
    else if (norm <= 2) nice = 2;
    else if (norm <= 5) nice = 5;
    else                nice = 10;
    return nice * mag;
  }

  function mkSparklineFor(path) {
    // Per-row sparkline: pulls series out of anData if available (all
    // article rows only have all-time totals; for the row sparkline we
    // synthesize a placeholder from the site's 30d series scaled by share).
    var wrap = svg('svg', {
      class: 'an-row-spark',
      viewBox: '0 0 90 22', preserveAspectRatio: 'none'
    });
    // For the overview row, the per-path 30d series isn't fetched yet;
    // this is a visual cue only — the drill-down uses real data.
    var series = anData.timeseries;
    var max = 0;
    series.forEach(function (d) { if (d.views > max) max = d.views; });
    if (max === 0) return wrap;

    // Deterministic wobble based on path so each row's spark looks distinct
    // without another network call.
    var seed = 0;
    for (var i = 0; i < path.length; i++) seed = (seed * 31 + path.charCodeAt(i)) & 0xffff;
    function rand() { seed = (seed * 1103515245 + 12345) & 0xffff; return seed / 0xffff; }

    var pts = series.map(function (d, i) {
      var v = d.views * (0.5 + rand() * 0.7);
      var y = 20 - Math.round(v / max * 18);
      var x = (i / (series.length - 1)) * 90;
      return x + ',' + y;
    });
    var path2 = svg('path', {
      d: 'M ' + pts.join(' L '),
      fill: 'none'
    });
    wrap.appendChild(path2);
    return wrap;
  }

  // ── Drill-down ──────────────────────────────────────────────
  function anDrill(path) {
    if (anDrillCache[path]) { renderAnDrill(anDrillCache[path]); return; }
    var app = document.getElementById('an-app');
    app.innerHTML = '<p style="color:var(--muted)">loading ' + path + '...</p>';
    fetch('/api/beacon?action=path&p=' + encodeURIComponent(path), { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { app.innerHTML = '<p style="color:var(--code-err)">' + d.error + '</p>'; return; }
        anDrillCache[path] = d;
        renderAnDrill(d);
      })
      .catch(function (err) { app.innerHTML = '<p style="color:var(--code-err)">error: ' + err.message + '</p>'; });
  }

  function renderAnDrill(d) {
    var app = document.getElementById('an-app');
    app.innerHTML = '';

    var back = el('button', 'an-back', '← back to overview');
    back.addEventListener('click', function () { renderAnOverview(); });
    app.appendChild(back);

    app.appendChild(el('div', 'an-drill-title', niceLabel(d.path)));
    var firstStr = d.totals.first ? new Date(d.totals.first).toISOString().slice(0, 10) : '—';
    var lastStr  = d.totals.last  ? new Date(d.totals.last).toISOString().slice(0, 10)  : '—';
    app.appendChild(el('div', 'an-drill-sub', d.path + '  ·  first seen ' + firstStr + '  ·  last ' + lastStr));

    // ── Tiles ──
    var tiles = el('div', 'an-tiles');
    tiles.appendChild(mkTile('Views',      fmtNum(d.totals.views), 'all-time', true));
    tiles.appendChild(mkTile('Reads',      fmtNum(d.totals.reads), '≥80% depth + dwell', false));
    tiles.appendChild(mkTile('Read rate',  pct(d.totals.reads, d.totals.views), 'reads / views', false));
    var refCount = d.referrers.reduce(function (s, r) { return s + r.count; }, 0);
    tiles.appendChild(mkTile('External refs', fmtNum(refCount), (d.referrers.length || 0) + ' unique origins', false));
    app.appendChild(tiles);

    // ── 30-day chart ──
    var chartCard = el('div', 'an-card');
    var chd = el('div', 'an-card-hd');
    chd.appendChild(el('span', 'an-card-title', 'Last 30 days'));
    var legend = el('div', 'an-legend');
    var lv = el('span', null, null); lv.innerHTML = '<span class="an-legend-dot an-legend-views"></span>views';
    var lr = el('span', null, null); lr.innerHTML = '<span class="an-legend-dot an-legend-reads"></span>reads';
    legend.appendChild(lv); legend.appendChild(lr);
    chd.appendChild(legend);
    chartCard.appendChild(chd);
    chartCard.appendChild(mkBarChart(d.timeseries));
    app.appendChild(chartCard);

    // ── Two-column: depth histogram + referrers ──
    var two = el('div', 'an-two-col');
    two.appendChild(mkDepthCard(d.depth));
    two.appendChild(mkRefCard(d.referrers));
    app.appendChild(two);

    // ── Danger zone ──
    var danger = el('div', 'an-danger-zone');
    var reset = el('button', 'adm-btn adm-btn-sm adm-btn-danger', 'reset this path');
    reset.addEventListener('click', function () {
      if (!confirm('Wipe ALL analytics for ' + d.path + '?\n\nThis is irreversible.')) return;
      reset.textContent = '...';
      fetch('/api/beacon', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ action: 'reset', path: d.path })
      }).then(function (r) { return r.json(); }).then(function (out) {
        if (out.ok) {
          delete anDrillCache[d.path];
          anLoaded = false;
          anLoad(true);
        } else {
          reset.textContent = 'error';
        }
      });
    });
    danger.appendChild(reset);
    app.appendChild(danger);
  }

  function mkDepthCard(depth) {
    var card = el('div', 'an-card');
    var hd = el('div', 'an-card-hd');
    hd.appendChild(el('span', 'an-card-title', 'Scroll depth'));
    hd.appendChild(el('span', 'an-card-hint', 'max depth reached per session'));
    card.appendChild(hd);

    var buckets = ['0', '25', '50', '75', '100'];
    var labels  = ['<25%', '25-49%', '50-74%', '75-99%', '100%'];
    var max = 0;
    buckets.forEach(function (b) { if (depth[b] > max) max = depth[b]; });

    var list = el('div', 'an-depth-list');
    if (max === 0) {
      card.appendChild(el('div', 'an-empty', 'no depth data yet'));
      return card;
    }
    buckets.forEach(function (b, i) {
      var row = el('div', 'an-depth-row');
      row.appendChild(el('span', 'an-depth-label', labels[i]));
      var bar = el('div', 'an-depth-bar');
      var fill = el('div', 'an-depth-fill');
      fill.style.width = (depth[b] / max * 100) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el('span', 'an-depth-count', fmtNum(depth[b])));
      list.appendChild(row);
    });
    card.appendChild(list);
    return card;
  }

  function mkRefCard(refs) {
    var card = el('div', 'an-card');
    var hd = el('div', 'an-card-hd');
    hd.appendChild(el('span', 'an-card-title', 'Top referrers'));
    hd.appendChild(el('span', 'an-card-hint', 'external origins only'));
    card.appendChild(hd);
    if (!refs.length) {
      card.appendChild(el('div', 'an-empty', 'no external referrers yet'));
      return card;
    }
    var list = el('div', 'an-ref-list');
    refs.forEach(function (r) {
      var row = el('div', 'an-ref-row');
      var origin = r.origin.replace(/^https?:\/\//, '');
      row.appendChild(el('span', 'an-ref-origin', origin));
      row.appendChild(el('span', 'an-ref-count', fmtNum(r.count)));
      list.appendChild(row);
    });
    card.appendChild(list);
    return card;
  }
})();
</script>
